# audio-brain on the home cluster. The plan and the reasons are in deploy/KUBERNETES.md.

appName: audio-brain

image:
  repository: 810574566145.dkr.ecr.eu-west-2.amazonaws.com/audio-brain
  pullPolicy: IfNotPresent  # tags are commit SHAs, and the image is large

imagePullSecrets:
  - name: ecr-registry-secret

# The two nodes (INFRA.md, "The layout"). large is the 32 GB node, kept for heavy compute and the big volumes: it's
# tainted size=large:NoSchedule, so only pods with this toleration run there. small is the 8 GB control-plane node,
# for what's always on and light.
nodes:
  large:
    nodeSelector:
      size: large
    tolerations:
      - key: size
        operator: Equal
        value: large
        effect: NoSchedule
  small:
    nodeSelector:
      size: small

# true stops the API and every worker (replicas 0), for moving the database and the data volume between nodes
# (deploy/KUBERNETES.md, "Moving to another node"); the MCP pod stays up and reports the API as down
paused: false

# CI rewrites these lines on every build (.github/workflows/deploy.yaml); the MCP image is tagged mcp-<sha>
env:
  IMAGE_TAG: '68fdc435d9ce9837b174f21eb11651ab960b4cef'
  MCP_IMAGE_TAG: '68fdc435d9ce9837b174f21eb11651ab960b4cef'

# Every property of this AWS Secrets Manager secret becomes an environment variable: POSTGRES_PASSWORD, SECRET_KEY,
# API_TOKEN and the API keys (the list is in deploy/KUBERNETES.md, Phase 0)
awsSecretsKey: audio-brain

# Non-secret settings, as environment variables (every key is in server/.env.example)
config:
  DEBUG: "0"
  DJANGO_LOG_LEVEL: INFO
  # the node's Tailscale IP is for the emulator (no MagicDNS there); audio-brain-api is how the MCP pod reaches the API
  ALLOWED_HOSTS: localhost,127.0.0.1,.ts.net,100.122.82.67,audio-brain-api
  GUNICORN_WORKERS: "1"  # each process loads its own models; threads are cheaper on 8 GB
  GUNICORN_THREADS: "8"
  GUNICORN_TIMEOUT: "300"
  MIXES_THREADS: "2"
  TIDAL_COUNTRY: GB
  LISTENING_TIME_ZONE: Europe/London
  HF_HOME: /app/server/models/hf
  OPENAI_MODEL: gpt-4.1-mini
  # The MusicBrainz mirror below, for lookups: set to http://musicbrainz:5000/ws/2/ only once its import has finished
  # (deploy/KUBERNETES.md, "The MusicBrainz mirror"); empty asks musicbrainz.org for everything
  MUSICBRAINZ_BASE_URL: http://musicbrainz:5000/ws/2/
  # Its database, for the searches its web service can't do (clients/musicbrainz_db.py); read-only, and its
  # credentials are musicbrainz-docker's defaults, reachable only inside the cluster. Empty searches musicbrainz.org
  MUSICBRAINZ_DATABASE_URL: postgresql://musicbrainz:musicbrainz@musicbrainz-db:5432/musicbrainz_db

api:
  nodePort: 30800  # reached over Tailscale at http://<node>.<tailnet>.ts.net:30800
  node: large
  threads: 4  # torch and numpy, for CLAP and the scorer
  # A playlist build (Ask, radio) loads the scorer's catalogue and CLAP and keeps them: about 1.9 GB, measured 20 Oct
  # at 33k tracks. No CPU limits anywhere: under contention CPU is shared by request, so the main lane wins
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi

worker:
  replicas: 1  # 1 after the cut-over from the Mac; never more, or jobs run twice
  # with perLane false, one worker runs every lane, with these
  node: large
  threads: 8
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 3584Mi
  # One Deployment per lane, each with its own node, limit and thread cap (INFRA.md I6b), in place of the one above.
  # data: whether it mounts the data volume, which ties it to the API's node. Limits to be revised from I3's peaks.
  perLane: true
  lanes:
    main:  # models, the ranker, mixes, candidates and audio analysis: the big one, so the largest CPU share
      node: large
      data: true
      threads: 8
      resources:
        requests:
          cpu: "4"
          memory: 3Gi
        limits:
          memory: 12Gi
    lookups:  # enrichment: API calls, mostly waiting on rate limits, so no files and the small node
      node: small
      data: false
      threads: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    sync:  # Last.fm, favourites, Tidal's mixes, and provided tracklists, which analyse their new tracks
      node: large
      data: true
      threads: 2
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 2Gi

# Enable only for a deliberate one-off backtest. The Job uses the same app image, database credentials and models PVC
# as the API and main worker, and runs on the large node with lower scheduling priority.
backtest:
  enabled: false
  runId: ""  # required when enabled; use a new short id for each Job
  imageTag: ""  # optional branch image tag; empty uses env.IMAGE_TAG
  days: 42  # single-cutoff baseline; set cutoffs to run a multi-cutoff comparison
  cutoffs: ""
  variants:
    - default
  baseline: default
  reuse: false
  keep: true
  label: cluster-baseline
  threads: 4
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 604800
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 10Gi

postgresql:
  image: 810574566145.dkr.ecr.eu-west-2.amazonaws.com/audio-brain:postgres-68fdc435d9ce9837b174f21eb11651ab960b4cef
  database: audio_brain
  username: audio_brain
  node: large
  # On the new node's NVMe: the database, four backtest clones (about 3 GB each at 80k tracks), the discogs database
  # (I7) and headroom. data-nvme can grow a volume in place; local-path can't
  claim: postgres-nvme
  storageClass: data-nvme
  storage: 80Gi
  # Kept modest: the OS file cache does most of the caching, and gives memory back when the worker needs it. Raise
  # shared_buffers only if I3 shows models waiting on reads
  settings:
    shared_buffers: 1GB
    effective_cache_size: 8GB
    work_mem: 32MB
    maintenance_work_mem: 512MB
  shmSize: 512Mi
  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      memory: 4Gi

# Essentia graphs, the trained scorer and context ranker and the Hugging Face cache; shared by the API and the main
# and sync lanes, so they're on one node (RWO). The default local-path class puts it on that node's root disk,
# keeping the NVMe for postgres and the MusicBrainz mirror
data:
  claim: data-root
  storageClass: local-path
  storage: 10Gi

# The Claude MCP server (MCP.md). Its secrets are the MCP_* keys of the AWS secret, MCP_PUBLIC_URL among them (the
# Funnel URL, https://<node>.<tailnet>.ts.net), so the node's name stays out of this public repo
mcp:
  enabled: true
  nodePort: 30801  # Funnel serves this on 443; the only public port
  storage: 100Mi  # the OAuth SQLite file; delete it to revoke every token
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# Claims from before the move to the new node (I5), on the old node: kept as they are, unused, so a rollback has
# them. Remove them from here and delete them by hand only once a full night has run on the new node.
legacyClaims:
  - name: data
    storage: 5Gi
  - name: postgres
    storage: 10Gi

# A MusicBrainz mirror without search (INFRA.md I6), on the large node: about 4 GB of RAM and 100 GB of NVMe
musicbrainz:
  enabled: true
  # the versions musicbrainz-docker's prebuilt images use; a server upgrade can need a schema change (see its README)
  image: metabrainz/musicbrainz-docker-musicbrainz:v-2026-09-21.0-build0
  dbImage: metabrainz/musicbrainz-docker-db:18-build0
  valkeyImage: valkey/valkey:9-alpine
  serverReplicas: 1
  serverProcesses: 4  # each a Perl process; audio-brain makes one request at a time per stage
  replicationSchedule: "0 11 * * *"  # UTC
  dbStorage: 100Gi
  dumpStorage: 80Gi  # the full export's download and its unpacked tables, only needed for the import (local-path
  # doesn't enforce it)
  # the whole database is tens of GB and lookups touch a little of it; the file cache does the rest
  dbSettings:
    shared_buffers: 1GB
    effective_cache_size: 4GB
    maintenance_work_mem: 512MB  # the import builds the indexes
  dbResources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2560Mi
  serverResources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

backup:
  enabled: true
  schedule: "15 0 * * *"  # before the nightly jobs (enrichment 01:00, models 03:00)
  keepDays: 7
  # on the small node, so the dumps are on a different machine from the database. local-path doesn't enforce the
  # size (and can't grow a volume), so this stays as first made: the dumps can use the root disk's free space
  node: small
  storage: 10Gi
