{{- /*
One worker running every lane, or with worker.perLane one Deployment per lane (`run_jobs --lane <lane>`), so one
lane's memory can't kill another's runs and each has its own limit. A worker that mounts the data PVC (RWO) must be on
its node, with the API; the lookups lane needs no files (rate limits are paced through the database), so it runs on
the small node. paused stops every worker, for the move between nodes.
*/ -}}
{{- $workers := list (dict "name" (printf "%s-worker" .Values.appName) "lanes" list "resources" .Values.worker.resources "node" .Values.worker.node "threads" .Values.worker.threads "data" true) }}
{{- if .Values.worker.perLane }}
{{- $workers = list }}
{{- range $lane, $config := .Values.worker.lanes }}
{{- $workers = append $workers (dict "name" (printf "%s-worker-%s" $.Values.appName $lane) "lanes" (list $lane) "resources" $config.resources "node" $config.node "threads" $config.threads "data" $config.data) }}
{{- end }}
{{- end }}
{{- range $worker := $workers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $worker.name }}
  labels:
    {{- include "audio-brain.labels" $ | nindent 4 }}
spec:
  replicas: {{ if $.Values.paused }}0{{ else }}{{ $.Values.worker.replicas }}{{ end }}
  strategy:
    type: Recreate  # the old worker stops before the new one starts, so no job runs twice
  selector:
    matchLabels:
      app: {{ $worker.name }}
  template:
    metadata:
      labels:
        app: {{ $worker.name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      {{- include "audio-brain.podSpec" (dict "root" $ "node" $worker.node "data" $worker.data) | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ include "audio-brain.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["python", "manage.py", "run_jobs"{{ range $worker.lanes }}, "--lane", {{ . | quote }}{{ end }}]
          {{- include "audio-brain.env" $ | nindent 10 }}
          env:
            {{- include "audio-brain.threads" $worker.threads | nindent 12 }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          {{- if $worker.data }}
          volumeMounts:
            - name: data
              mountPath: /app/server/models
          {{- end }}
{{- end }}
