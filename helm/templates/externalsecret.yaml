apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.appName }}-aws-secrets
  labels:
    {{- include "audio-brain.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: {{ .Values.appName }}-aws-secrets
    creationPolicy: Owner
  # every property of the AWS secret, so adding a key there needs no chart change
  dataFrom:
    - extract:
        key: {{ .Values.awsSecretsKey }}
