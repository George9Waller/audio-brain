apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-api
  labels:
    {{- include "audio-brain.labels" . | nindent 4 }}
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: {{ .Values.api.nodePort }}
  selector:
    app: {{ .Values.appName }}-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-api
  labels:
    {{- include "audio-brain.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.paused }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}-api
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}-api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "audio-brain.podSpec" (dict "root" . "node" .Values.api.node "data" true) | nindent 6 }}
      initContainers:
        # migrations run here rather than in a pre-sync hook, which on the first sync would start before Postgres
        - name: migrate
          image: {{ include "audio-brain.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT"; do sleep 2; done; python manage.py migrate --noinput
          {{- include "audio-brain.env" . | nindent 10 }}
      containers:
        - name: api
          image: {{ include "audio-brain.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          {{- include "audio-brain.env" . | nindent 10 }}
          env:
            {{- include "audio-brain.threads" .Values.api.threads | nindent 12 }}
          # TCP, because /api/v1/health needs the bearer token
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 60
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/server/models
