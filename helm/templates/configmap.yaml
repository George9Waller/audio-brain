apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-config
  labels:
    {{- include "audio-brain.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ .Values.appName }}-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: {{ .Values.postgresql.database }}
  POSTGRES_USER: {{ .Values.postgresql.username }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
