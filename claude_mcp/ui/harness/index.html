<!doctype html>
<!-- Dev only (npm run dev, then /harness/?view=list&theme=dark&width=390): plays Claude's part, so the
     components can be looked at and screenshotted with sample data. Not part of the build. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Component harness</title>
    <style>
      body { margin: 0; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; background: #faf9f5; color: #141413; }
      body.dark { background: #262624; color: #faf9f5; }
      .chat { margin: 0 auto; }
      .bubble { margin: 0 0 12px; opacity: .8; }
      iframe { display: block; width: 100%; border: 1px solid #1f1e1d26; border-radius: 12px; background: transparent; }
      body.dark iframe { border-color: #faf9f526; }
      body.fullscreen iframe { position: fixed; inset: 0; width: 100vw; height: 100vh !important; border: 0; border-radius: 0; z-index: 2; }
      #log { margin-top: 12px; font: 12px ui-monospace, monospace; opacity: .7; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="chat">
      <p class="bubble">Here are your lists:</p>
      <iframe id="app" title="component"></iframe>
      <div id="log"></div>
    </div>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
