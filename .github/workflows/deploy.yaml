name: Deploy to argocd

# Builds the server, PostgreSQL and Claude MCP images when their code changes, pushes them to ECR and points
# helm/values.yaml at them; Argo CD syncs from there. All go in the ECR repository audio-brain, with server-, mcp-
# and postgres- prefixes. Needs that repository and this repo in GHActionsECRRole's trust policy. The tag
# commit is pushed with the built-in GITHUB_TOKEN; its pushes start no workflows, and Argo CD reads the change from git.
# Changes to this workflow rebuild all three images, including images whose deployed ECR tags have been removed.

on:
  push:
    branches:
      - main
    paths:
      - server/**
      - claude_mcp/**
      - postgres/**
      - deploy/gunicorn.conf.py
      - .dockerignore
      - .github/workflows/deploy.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-deploy-main
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' }}
      mcp: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp == 'true' }}
      postgres: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.postgres == 'true' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: What changed
      id: filter
      uses: dorny/paths-filter@v4
      with:
        filters: |
          server:
            - server/**
            - deploy/gunicorn.conf.py
            - .dockerignore
            - .github/workflows/deploy.yaml
          mcp:
            - claude_mcp/**
            - .github/workflows/deploy.yaml
          postgres:
            - postgres/**
            - .github/workflows/deploy.yaml

  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: eu-west-2
        role-to-assume: arn:aws:iam::810574566145:role/GHActionsECRRole

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag and push image to ECR
      uses: docker/build-push-action@v6
      with:
        context: .
        file: server/Dockerfile
        platforms: linux/amd64
        push: true
        provenance: false  # one plain image in ECR, not an index with an attestation alongside
        tags: ${{ steps.login-ecr.outputs.registry }}/audio-brain:server-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2; no floating major tags after v7
      with:
        version: 0.13.5

    - name: Test
      working-directory: claude_mcp
      run: uv run --frozen pytest -q

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: eu-west-2
        role-to-assume: arn:aws:iam::810574566145:role/GHActionsECRRole

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag and push image to ECR
      uses: docker/build-push-action@v6
      with:
        context: claude_mcp
        platforms: linux/amd64
        push: true
        provenance: false
        tags: ${{ steps.login-ecr.outputs.registry }}/audio-brain:mcp-${{ github.sha }}
        cache-from: type=gha,scope=mcp
        cache-to: type=gha,mode=max,scope=mcp

  build-postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: eu-west-2
        role-to-assume: arn:aws:iam::810574566145:role/GHActionsECRRole

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag and push PostgreSQL image to ECR
      uses: docker/build-push-action@v6
      with:
        context: .
        file: postgres/Dockerfile
        platforms: linux/amd64
        push: true
        provenance: false
        tags: ${{ steps.login-ecr.outputs.registry }}/audio-brain:postgres-${{ github.sha }}
        cache-from: type=gha,scope=postgres
        cache-to: type=gha,mode=max,scope=postgres

  update-image-tag:
    needs: [changes, build, build-mcp, build-postgres]
    # after whichever builds ran, as long as none failed
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.build.result == 'success' || needs.build-mcp.result == 'success' || needs.build-postgres.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Configure git
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Update image tags in Helm values
      run: |
        git pull --rebase
        if [ "${{ needs.build.result }}" = success ]; then
          sed -i "s|^  IMAGE_TAG:.*|  IMAGE_TAG: 'server-${{ github.sha }}'|" helm/values.yaml
        fi
        if [ "${{ needs.build-mcp.result }}" = success ]; then
          sed -i "s|^  MCP_IMAGE_TAG:.*|  MCP_IMAGE_TAG: '${{ github.sha }}'|" helm/values.yaml
        fi
        if [ "${{ needs.build-postgres.result }}" = success ]; then
          sed -i "/^postgresql:/,/^[^ ]/s|^  image: .*|  image: 810574566145.dkr.ecr.eu-west-2.amazonaws.com/audio-brain:postgres-${{ github.sha }}|" helm/values.yaml
        fi
        git add helm/values.yaml
        git commit -m "Update image tag to ${{ github.sha }}"
        git push
